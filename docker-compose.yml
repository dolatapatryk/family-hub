services:
  family-api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  family-web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      family-api:
        condition: service_healthy

